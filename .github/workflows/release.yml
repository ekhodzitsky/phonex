name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            onnx_arch: x64
            onnx_dir: onnxruntime-linux-x64-1.25.1
          - target: aarch64-apple-darwin
            os: macos-latest
            onnx_arch: none
            onnx_dir: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            onnx_arch: x64
            onnx_dir: onnxruntime-win-x64-1.25.1
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            onnx_arch: aarch64
            onnx_dir: onnxruntime-linux-aarch64-1.25.1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install ONNX Runtime (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v1.25.1/${{ matrix.onnx_dir }}.tgz -o onnxruntime.tgz
          sudo tar -xzf onnxruntime.tgz -C /opt
          sudo mv /opt/${{ matrix.onnx_dir }} /opt/onnxruntime
          echo "ORT_LIB_PATH=/opt/onnxruntime/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/onnxruntime/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV

      - name: Install ONNX Runtime (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install onnxruntime
          echo "ORT_LIB_PATH=$(brew --prefix onnxruntime)/lib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$(brew --prefix onnxruntime)/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV

      - name: Install ONNX Runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v1.25.1/${{ matrix.onnx_dir }}.zip -o onnxruntime.zip
          unzip -q onnxruntime.zip
          mv ${{ matrix.onnx_dir }} /c/onnxruntime
          echo "ORT_LIB_PATH=/c/onnxruntime/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} --bin phonex --bin server --bin streaming
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build FFI library
        run: |
          cargo build --release --target ${{ matrix.target }} --features ffi --no-default-features
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p phonex-${{ matrix.target }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/phonex.exe phonex-${{ matrix.target }}/ || true
            cp target/${{ matrix.target }}/release/server.exe phonex-${{ matrix.target }}/ || true
            cp target/${{ matrix.target }}/release/streaming.exe phonex-${{ matrix.target }}/ || true
            cp target/${{ matrix.target }}/release/phonex.dll phonex-${{ matrix.target }}/ || true
            zip -r phonex-${{ matrix.target }}.zip phonex-${{ matrix.target }}
          else
            cp target/${{ matrix.target }}/release/phonex phonex-${{ matrix.target }}/ || true
            cp target/${{ matrix.target }}/release/server phonex-${{ matrix.target }}/ || true
            cp target/${{ matrix.target }}/release/streaming phonex-${{ matrix.target }}/ || true
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              cp target/${{ matrix.target }}/release/libphonex.dylib phonex-${{ matrix.target }}/ || true
            else
              cp target/${{ matrix.target }}/release/libphonex.so phonex-${{ matrix.target }}/ || true
            fi
            tar czf phonex-${{ matrix.target }}.tar.gz phonex-${{ matrix.target }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonex-${{ matrix.target }}
          path: phonex-${{ matrix.target }}.${{ matrix.os == 'windows-latest' && 'zip' || 'tar.gz' }}

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true

  publish-crate:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install ONNX Runtime (Ubuntu)
        run: |
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v1.25.1/onnxruntime-linux-x64-1.25.1.tgz -o onnxruntime.tgz
          sudo tar -xzf onnxruntime.tgz -C /opt
          sudo mv /opt/onnxruntime-linux-x64-1.25.1 /opt/onnxruntime
          echo "ORT_LIB_PATH=/opt/onnxruntime/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/onnxruntime/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV

      - name: Verify package
        run: cargo publish --dry-run --allow-dirty

      - name: Publish to crates.io
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
